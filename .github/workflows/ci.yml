name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --extra pipelines

      - name: Run linting
        run: uv run ruff check src/ tests/

      - name: Run type checking
        run: uv run mypy src/

      - name: Run tests
        run: uv run pytest --cov=quicketl --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Check package
        run: uvx twine check dist/*

      # A plain `pip install quicketl` must stay slim: no data stack, core
      # commands work, and pipeline commands point to the pipelines extra.
      - name: Check the slim install
        run: |
          uv venv /tmp/slim --python 3.12
          uv pip install --python /tmp/slim/bin/python dist/*.whl
          /tmp/slim/bin/python -c "import importlib.util as u, sys; heavy = [m for m in ('ibis', 'pyarrow', 'pandas', 'polars', 'duckdb', 'fsspec') if u.find_spec(m)]; sys.exit(f'slim install pulled in: {heavy}' if heavy else 0)"
          cd "$(mktemp -d)"
          /tmp/slim/bin/quicketl --help > /dev/null
          /tmp/slim/bin/quicketl init demo > /dev/null
          /tmp/slim/bin/quicketl validate demo/pipelines/sample.yml > /dev/null
          if /tmp/slim/bin/quicketl run demo/pipelines/sample.yml 2> err.txt; then
            echo "quicketl run should fail without the pipelines extra"
            exit 1
          fi
          grep -F "pip install 'quicketl[pipelines]'" err.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
